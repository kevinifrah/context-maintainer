[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-maintainer"
version = "0.6.0"
description = "Durable, evidence-based project context for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Context Maintainer Contributors" }]
keywords = ["context", "documentation", "agents", "claude-code", "codex"]
dependencies = []

[project.urls]
Homepage = "https://github.com/kevinifrah/context-maintainer"
Repository = "https://github.com/kevinifrah/context-maintainer"
Issues = "https://github.com/kevinifrah/context-maintainer/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
context-maintainer = "context_maintainer.cli:main"

# The package lives inside the plugin directory on purpose: both Claude Code
# and Codex copy only the plugin subdirectory when installing a plugin, so a
# package outside it would be missing on the user's machine. Keeping it here
# means one canonical copy that works for pip installs, symlinked checkouts,
# and marketplace plugin installs alike.
[tool.setuptools.packages.find]
where = ["skill/context-maintainer"]
include = ["context_maintainer*"]

[tool.setuptools.package-data]
context_maintainer = ["templates/*"]
